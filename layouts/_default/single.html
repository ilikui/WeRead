{{ define "main" }}
<div class="reading-progress" aria-hidden="true"><span id="readingProgressBar"></span></div>
<article class="page article-layout">
    <header class="page-header">
        <h1>{{ .Title }}</h1>
        {{ with .Params.subtitle }}<p class="page-subtitle">{{ . }}</p>{{ end }}
        {{ with .Date }}<p class="article-meta"><time datetime="{{ .Format "2006-01-02" }}">{{ .Format "2006年01月02日" }}</time></p>{{ end }}
    </header>
    <div class="article-grid">
        <div class="page-content" id="articleContent">
            {{ .Content }}
        </div>
        <aside class="article-toc-wrap" aria-label="文章导航">
            <nav class="article-toc" id="articleToc">
                <div class="article-toc-heading">本文目录</div>
                <ol id="articleTocList"><li class="toc-loading">正在整理目录…</li></ol>
            </nav>
        </aside>
    </div>
</article>
{{ partial "markdown-extensions.html" . }}
<script>
(function () {
    const content = document.getElementById('articleContent');
    const toc = document.getElementById('articleToc');
    const list = document.getElementById('articleTocList');
    const progress = document.getElementById('readingProgressBar');
    if (!content || !toc || !list) return;

    const headings = Array.from(content.querySelectorAll('h2, h3'));
    const used = new Set();
    const slugify = (value) => value.trim().toLowerCase()
        .replace(/[^\\p{L}\\p{N}\\s-]/gu, '')
        .replace(/[\\s]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'section';

    headings.forEach((heading, index) => {
        if (!heading.id) {
            let id = slugify(heading.textContent);
            const base = id;
            let suffix = 2;
            while (used.has(id) || document.getElementById(id)) id = base + '-' + suffix++;
            heading.id = id;
        }
        used.add(heading.id);
        heading.classList.add('article-heading-anchor');
    });

    if (!headings.length) {
        toc.hidden = true;
    } else {
        list.innerHTML = headings.map((heading) =>
            '<li class="toc-level-' + heading.tagName.toLowerCase() + '">' +
            '<a href="#' + encodeURIComponent(heading.id) + '">' +
            heading.textContent.trim().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
            '</a></li>'
        ).join('');

        const links = Array.from(list.querySelectorAll('a'));
        const setActive = (id) => links.forEach((link) => {
            const active = decodeURIComponent(link.getAttribute('href').slice(1)) === id;
            link.classList.toggle('active', active);
            if (active) link.setAttribute('aria-current', 'location');
            else link.removeAttribute('aria-current');
        });

        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                const visible = entries.filter((entry) => entry.isIntersecting)
                    .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
                if (visible[0]) setActive(visible[0].target.id);
            }, { rootMargin: '-12% 0px -72% 0px', threshold: 0 });
            headings.forEach((heading) => observer.observe(heading));
        }

        links.forEach((link) => link.addEventListener('click', (event) => {
            const id = decodeURIComponent(link.getAttribute('href').slice(1));
            const target = document.getElementById(id);
            if (!target) return;
            event.preventDefault();
            history.replaceState(null, '', '#' + encodeURIComponent(id));
            target.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
            setActive(id);
        }));
    }

    let ticking = false;
    const updateProgress = () => {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        const percent = scrollable > 0 ? Math.min(100, Math.max(0, window.scrollY / scrollable * 100)) : 0;
        if (progress) progress.style.width = percent + '%';
        ticking = false;
    };
    window.addEventListener('scroll', () => {
        if (!ticking) {
            window.requestAnimationFrame(updateProgress);
            ticking = true;
        }
    }, { passive: true });
    window.addEventListener('resize', updateProgress);
    updateProgress();
})();
</script>
{{ end }}
