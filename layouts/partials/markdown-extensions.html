{{- $raw := .RawContent -}}
{{- $hasMermaid := in $raw "mermaid" -}}
{{- $hasMath := or (in $raw "$$") (in $raw "\\[") (in $raw "\\(") (findRE "\\$[^\\n$]+\\$" $raw) -}}

{{- if $hasMermaid }}
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
(function () {
    function renderMermaid() {
        var blocks = document.querySelectorAll('.page-content pre > code.language-mermaid, .page-content code.language-mermaid');
        if (!blocks.length) return;
        if (!window.mermaid) {
            console.warn('Mermaid failed to load; diagram source remains available.');
            return;
        }
        blocks.forEach(function (code) {
            var pre = code.closest('pre');
            var div = document.createElement('div');
            div.className = 'mermaid';
            div.textContent = code.textContent;
            if (pre && pre.parentNode) pre.parentNode.replaceChild(div, pre);
            else code.parentNode.replaceChild(div, code);
        });
        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'strict',
            theme: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'neutral'
        });
        mermaid.run({ querySelector: '.page-content .mermaid' }).catch(function (error) {
            console.error('Mermaid rendering failed:', error);
        });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderMermaid);
    else renderMermaid();
})();
</script>
{{- end }}

{{- if $hasMath }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
(function () {
    function renderMath() {
        var root = document.querySelector('.page-content');
        if (!root || typeof window.renderMathInElement !== 'function') return;
        window.renderMathInElement(root, {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false },
                { left: '$', right: '$', display: false }
            ],
            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
            throwOnError: false,
            strict: 'ignore'
        });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderMath);
    else renderMath();
})();
</script>
{{- end }}

<script>
(function () {
    function enhanceCodeBlocks() {
        document.querySelectorAll('.page-content pre').forEach(function (pre) {
            if (pre.dataset.enhanced === 'true') return;
            var code = pre.querySelector('code');
            if (!code) return;
            pre.dataset.enhanced = 'true';
            var wrap = document.createElement('div');
            wrap.className = 'code-block-wrap';
            pre.parentNode.insertBefore(wrap, pre);
            wrap.appendChild(pre);
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'code-copy-button';
            button.textContent = '复制代码';
            button.setAttribute('aria-label', '复制代码');
            button.addEventListener('click', function () {
                var text = code.textContent;
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(function () {
                        button.textContent = '已复制';
                        setTimeout(function () { button.textContent = '复制代码'; }, 1400);
                    }).catch(function () { button.textContent = '复制失败'; });
                } else {
                    var area = document.createElement('textarea');
                    area.value = text;
                    area.style.position = 'fixed';
                    area.style.opacity = '0';
                    document.body.appendChild(area);
                    area.select();
                    try {
                        document.execCommand('copy');
                        button.textContent = '已复制';
                    } catch (error) {
                        button.textContent = '复制失败';
                    }
                    area.remove();
                    setTimeout(function () { button.textContent = '复制代码'; }, 1400);
                }
            });
            wrap.appendChild(button);
        });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enhanceCodeBlocks);
    else enhanceCodeBlocks();
})();
</script>
