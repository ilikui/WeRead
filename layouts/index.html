{{ define "main" }}
<section class="hero">
    <h1>微信读书笔记墙</h1>
    <p>使用 Hugo 打造的静态读书笔记博客，汇聚划线、批注与思考。</p>
    <div class="hero-actions">
        <a class="btn btn-primary" href="{{ `/weread/` | relURL }}">开始阅读</a>
        <a class="btn" href="{{ `/about/` | relURL }}">了解更多</a>
    </div>
</section>

<section class="section">
    <h2 class="section-title">最近更新</h2>
    <div class="book-grid">
        {{ range first 4 (where site.RegularPages "Section" "weread") }}
        <article class="book-card">
            <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
            <p class="book-card-meta">{{ .Params.author }} · {{ len .Params.notes }} 条笔记</p>
        </article>
        {{ end }}
    </div>
</section>
{{ end }}
