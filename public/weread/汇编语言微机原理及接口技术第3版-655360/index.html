<script>
(function () {
    function enhanceCodeBlocks() {
        document.querySelectorAll('.page-content pre').forEach(function (pre) {
            if (pre.dataset.enhanced === 'true') return;
            var code = pre.querySelector('code');
            if (!code) return;
            pre.dataset.enhanced = 'true';
            var wrap = document.createElement('div');
            wrap.className = 'code-block-wrap';
            pre.parentNode.insertBefore(wrap, pre);
            wrap.appendChild(pre);
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'code-copy-button';
            button.textContent = '复制代码';
            button.setAttribute('aria-label', '复制代码');
            button.addEventListener('click', function () {
                var text = code.textContent;
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(function () {
                        button.textContent = '已复制';
                        setTimeout(function () { button.textContent = '复制代码'; }, 1400);
                    }).catch(function () { button.textContent = '复制失败'; });
                } else {
                    var area = document.createElement('textarea');
                    area.value = text;
                    area.style.position = 'fixed';
                    area.style.opacity = '0';
                    document.body.appendChild(area);
                    area.select();
                    try {
                        document.execCommand('copy');
                        button.textContent = '已复制';
                    } catch (error) {
                        button.textContent = '复制失败';
                    }
                    area.remove();
                    setTimeout(function () { button.textContent = '复制代码'; }, 1400);
                }
            });
            wrap.appendChild(button);
        });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', enhanceCodeBlocks);
    else enhanceCodeBlocks();
})();
</script>

<script>
(function () {
    const content = document.getElementById('articleContent');
    const toc = document.getElementById('articleToc');
    const list = document.getElementById('articleTocList');
    const progress = document.getElementById('readingProgressBar');
    if (!content || !toc || !list) return;

    const headings = Array.from(content.querySelectorAll('h2, h3'));
    const used = new Set();
    const slugify = (value) => value.trim().toLowerCase()
        .replace(/[^\p{L}\p{N}\s-]/gu, '')
        .replace(/[\s]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '') || 'section';

    headings.forEach((heading, index) => {
        if (!heading.id) {
            let id = slugify(heading.textContent);
            const base = id;
            let suffix = 2;
            while (used.has(id) || document.getElementById(id)) id = base + '-' + suffix++;
            heading.id = id;
        }
        used.add(heading.id);
        heading.classList.add('article-heading-anchor');
    });

    if (!headings.length) {
        toc.hidden = true;
    } else {
        list.innerHTML = headings.map((heading) =>
            '<li class="toc-level-' + heading.tagName.toLowerCase() + '">' +
            '<a href="#' + encodeURIComponent(heading.id) + '">' +
            heading.textContent.trim().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') +
            '</a></li>'
        ).join('');

        const links = Array.from(list.querySelectorAll('a'));
        const setActive = (id) => links.forEach((link) => {
            const active = decodeURIComponent(link.getAttribute('href').slice(1)) === id;
            link.classList.toggle('active', active);
            if (active) link.setAttribute('aria-current', 'location');
            else link.removeAttribute('aria-current');
        });

        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                const visible = entries.filter((entry) => entry.isIntersecting)
                    .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
                if (visible[0]) setActive(visible[0].target.id);
            }, { rootMargin: '-12% 0px -72% 0px', threshold: 0 });
            headings.forEach((heading) => observer.observe(heading));
        }

        links.forEach((link) => link.addEventListener('click', (event) => {
            const id = decodeURIComponent(link.getAttribute('href').slice(1));
            const target = document.getElementById(id);
            if (!target) return;
            event.preventDefault();
            history.replaceState(null, '', '#' + encodeURIComponent(id));
            target.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
            setActive(id);
        }));
    }

    let ticking = false;
    const updateProgress = () => {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        const percent = scrollable > 0 ? Math.min(100, Math.max(0, window.scrollY / scrollable * 100)) : 0;
        if (progress) progress.style.width = percent + '%';
        ticking = false;
    };
    window.addEventListener('scroll', () => {
        if (!ticking) {
            window.requestAnimationFrame(updateProgress);
            ticking = true;
        }
    }, { passive: true });
    window.addEventListener('resize', updateProgress);
    updateProgress();
})();
</script>

    <script>
    (function () {
        const TYPE_LABEL = { blog: '📝 博客', weread: '📚 读书', topic: '📁 专题', weekly: '📰 Weekly' };
        const input = document.getElementById('globalSearch');
        const results = document.getElementById('searchResults');
        const indexUrl = '\/index.json';
        let items = null;
        let loading = null;
        let activeIndex = -1;

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function loadIndex() {
            if (items) return Promise.resolve(items);
            if (loading) return loading;
            loading = fetch(indexUrl)
                .then((res) => res.json())
                .then((data) => { items = data; return items; })
                .catch(() => { items = []; return items; });
            return loading;
        }

        function closeResults() {
            results.hidden = true;
            results.innerHTML = '';
            activeIndex = -1;
        }

        function renderResults(matches) {
            if (!matches.length) {
                results.innerHTML = '<p class="search-empty">没有找到相关内容</p>';
                results.hidden = false;
                return;
            }
            results.innerHTML = matches.map((item, i) => `
                <a class="search-result" href="${escapeHtml(item.url)}" data-index="${i}">
                    <span class="search-result-type">${TYPE_LABEL[item.type] || '📄'}</span>
                    <span class="search-result-body">
                        <span class="search-result-title">${escapeHtml(item.title)}</span>
                        ${item.meta ? `<span class="search-result-meta">${escapeHtml(item.meta)}</span>` : ''}
                    </span>
                </a>
            `).join('');
            results.hidden = false;
        }

        let debounceTimer;
        input.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const term = input.value.trim().toLowerCase();
            if (!term) { closeResults(); return; }
            debounceTimer = setTimeout(() => {
                loadIndex().then((all) => {
                    const matches = all.filter((item) =>
                        item.title.toLowerCase().includes(term) ||
                        (item.meta || '').toLowerCase().includes(term)
                    ).slice(0, 8);
                    renderResults(matches);
                });
            }, 150);
        });

        input.addEventListener('keydown', (e) => {
            const links = results.querySelectorAll('.search-result');
            if (e.key === 'Escape') { closeResults(); input.blur(); }
            if (!links.length) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                activeIndex = Math.min(activeIndex + 1, links.length - 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                activeIndex = Math.max(activeIndex - 1, 0);
            } else if (e.key === 'Enter' && activeIndex >= 0) {
                e.preventDefault();
                links[activeIndex].click();
                return;
            } else {
                return;
            }
            links.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
        });

        document.addEventListener('keydown', (e) => {
            const typing = e.target && (e.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName));
            if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
                e.preventDefault(); input.focus(); input.select();
            }
            if (e.key === 'Escape' && document.activeElement === input) {
                input.value = ''; closeResults(); input.blur();
            }
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.nav-search')) closeResults();
        });
    })();
    </script>
