<!doctype html>
<html lang="zh-CN">
<head><script src="/livereload.js?mindelay=10&amp;v=2&amp;port=56497&amp;path=livereload" data-no-instant defer></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>阅读 | 阅读笔记</title>
    <meta name="description" content="微信读书笔记墙，左侧选择书籍查看划线与批注。">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css">
    
    <link rel="stylesheet" href="../css/weread-theme.min.53c35e12a8e75165d923efb90f0f6e6bbc42401b3c4ec2900b702ef54aab8751.css">
</head>
<body class="weread-page">
    <header class="site-header">
        <nav class="site-nav" aria-label="主导航">
            <a class="site-brand" href="../">阅读笔记</a>
            <ul class="nav-menu">
                
                <li><a href="../">首页</a></li>
                
                <li><a href="../weread/">阅读</a></li>
                
                <li><a href="../memos/">Memos</a></li>
                
                <li><a href="../about/">关于</a></li>
                
            </ul>
            <div class="nav-search">
                <input type="search" id="globalSearch" placeholder="Search" aria-label="搜索">
            </div>
        </nav>
    </header>

    <div class="weread-layout">
        <aside class="weread-side" aria-label="书单与分类">
            <div class="side-tabs">
                
                <a href="../weread/" class="side-tab active">
                    Read
                </a>
                
                <a href="../memos/" class="side-tab">
                    Memos
                </a>
                
                <a href="../blog/" class="side-tab">
                    Blog
                </a>
                
                <a href="../topics/" class="side-tab">
                    Topics
                </a>
                
                <a href="../gallery/" class="side-tab">
                    Gallery
                </a>
                
            </div>

            <div class="side-panel" id="bookshelfSide">
                <div class="side-head">书架</div>
                <div class="side-stats">
                    <div class="stat-item"><span class="stat-num" id="sideBookCount">0</span> 本书</div>
                    <div class="stat-item"><span class="stat-num" id="sideNoteCount">0</span> 条笔记</div>
                </div>
            </div>

            <div class="side-panel" id="detailSide" style="display:none">
                <div class="side-head">
                    <button id="backToBookshelf" class="back-btn" type="button">← 返回书架</button>
                </div>
                <div class="book-filter">
                    <select id="bookSelect" aria-label="选择书籍">
                        <option value="">切换书籍</option>
                    </select>
                </div>
                <div class="side-head">章节</div>
                <ul id="chapterList" class="chapter-list">
                    <li class="chapter-item empty">无章节</li>
                </ul>
            </div>
        </aside>

        <main class="weread-main">
            <header class="weread-hero">
                <h1>阅读</h1>
                <p id="wereadMeta">加载中…</p>
            </header>

            <section id="bookshelfView" class="bookshelf-view">
                <div id="bookshelfGrid" class="bookshelf-grid">
                    <p class="empty-state">加载中…</p>
                </div>
                <nav class="pagination" id="bookshelfPagination" aria-label="书籍分页"></nav>
            </section>

            <section id="detailView" class="detail-view" style="display:none">
                <div class="book-head">
                    <div class="book-cover" id="bookCover">
                        <img id="bookCoverImg" alt="书籍封面" />
                        <span id="bookCoverFallback" class="book-cover-fallback">书</span>
                    </div>
                    <div class="book-info">
                        <h2 id="bookTitle">请选择一本书</h2>
                        <p id="bookSub" class="book-sub">-</p>
                    </div>
                </div>

                <div id="notesGrid" class="notes-grid">
                    <p class="empty-state">选择一本书查看笔记。</p>
                </div>

                <nav class="pagination" id="detailPagination" aria-label="笔记分页"></nav>
            </section>
        </main>
    </div>

    <footer class="site-footer">
        <p>阅读笔记 · 使用 Hugo 构建</p>
    </footer>

    <input id="jsonFileInput" type="file" accept="application/json,.json" style="display:none">

    <script>
    (function() {
        const state = {
            books: [],
            view: 'bookshelf',
            selectedBookId: null,
            activeChapter: null,
            bookshelfPage: 1,
            bookshelfPerPage:  15 ,
            detailPage: 1,
            detailPerPage:  12 ,
            searchTerm: ''
        };
        
        
        const dataUrl = '../' + 'data\/weread_notes.json';

        function $(id) { return document.getElementById(id); }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        
        function toTs(value) {
            if (!value) return 0;
            if (typeof value === 'number') return value < 1e12 ? value * 1000 : value;
            const t = new Date(value).getTime();
            return isNaN(t) ? 0 : t;
        }

        function formatDate(value) {
            if (!value) return '';
            const ts = toTs(value);
            if (!ts) return String(value);
            return new Date(ts).toLocaleDateString('zh-CN');
        }

        
        function formatChapter(ch) {
            if (ch === null || ch === undefined || ch === '') return '';
            if (typeof ch === 'number') return '第 ' + ch + ' 章';
            return String(ch);
        }

        function coverUrl(cover) {
            if (!cover) return '';
            
            return cover.replace(/\/s_/, '/t9_');
        }

        
        function coverHtml(book, className) {
            const initial = escapeHtml((book.title || '书').trim().charAt(0) || '书');
            const cls = 'book-cover-thumb ' + (className || '');
            if (!book.cover) {
                return `<div class="${cls}"><span class="book-cover-fallback">${initial}</span></div>`;
            }
            const url = escapeHtml(coverUrl(book.cover));
            return `<div class="${cls}"><img src="${url}" alt="${initial}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><span class="book-cover-fallback" style="display:none">${initial}</span></div>`;
        }

        function renderBookCover(book) {
            const img = $('bookCoverImg');
            const fallback = $('bookCoverFallback');
            const initial = (book && book.title ? book.title.trim().charAt(0) : '书') || '书';

            if (!book || !book.cover) {
                img.style.display = 'none';
                img.removeAttribute('src');
                fallback.textContent = initial;
                fallback.style.display = 'flex';
                return;
            }

            img.onerror = function() {
                img.style.display = 'none';
                fallback.textContent = initial;
                fallback.style.display = 'flex';
            };
            img.onload = function() {
                img.style.display = '';
                fallback.style.display = 'none';
            };

            fallback.textContent = initial;
            img.src = coverUrl(book.cover);
            img.style.display = '';
            fallback.style.display = 'none';
        }

        function renderMeta(meta) {
            const generated = meta.generated_at ? `导出时间: ${formatDate(meta.generated_at)}` : '';
            const total = `书籍 ${meta.total_books || 0} 本 · 笔记 ${meta.total_notes || 0} 条`;
            $('wereadMeta').textContent = [generated, total].filter(Boolean).join(' | ');
        }

        function updateSideStats() {
            $('sideBookCount').textContent = state.books.length;
            const notes = state.books.reduce((sum, b) => sum + (b.notes || []).length, 0);
            $('sideNoteCount').textContent = notes;
        }

        function switchView(view, bookId) {
            state.view = view;
            if (view === 'bookshelf') {
                state.selectedBookId = null;
                state.activeChapter = null;
                state.searchTerm = '';
                $('globalSearch').value = '';
                state.bookshelfPage = 1;
                $('bookshelfView').style.display = '';
                $('detailView').style.display = 'none';
                $('bookshelfSide').style.display = '';
                $('detailSide').style.display = 'none';
                renderBookshelf();
            } else {
                state.selectedBookId = bookId || null;
                state.activeChapter = null;
                state.detailPage = 1;
                $('bookshelfView').style.display = 'none';
                $('detailView').style.display = '';
                $('bookshelfSide').style.display = 'none';
                $('detailSide').style.display = '';
                renderDetail();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filteredBooks() {
            const term = state.searchTerm.toLowerCase();
            let books = state.books;
            if (term) {
                books = books.filter(b => {
                    const t = (b.title || '').toLowerCase();
                    const a = (b.author || '').toLowerCase();
                    return t.includes(term) || a.includes(term);
                });
            }
            return books;
        }

        function renderPagination(totalItems, perPage, currentPage, navId, onChange) {
            const nav = $(navId);
            const totalPages = Math.max(1, Math.ceil(totalItems / perPage));
            if (totalPages <= 1) {
                nav.innerHTML = '';
                return;
            }
            let html = '';
            html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">上一页</button>`;
            html += `<span class="page-info">${currentPage} / ${totalPages}</span>`;
            html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">下一页</button>`;
            nav.innerHTML = html;

            nav.querySelectorAll('button[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = parseInt(btn.getAttribute('data-page'), 10);
                    if (page >= 1 && page <= totalPages) {
                        onChange(page);
                    }
                });
            });
        }

        function renderBookshelf() {
            const books = filteredBooks();
            const total = books.length;
            const totalPages = Math.max(1, Math.ceil(total / state.bookshelfPerPage));
            if (state.bookshelfPage > totalPages) state.bookshelfPage = totalPages || 1;
            const start = (state.bookshelfPage - 1) * state.bookshelfPerPage;
            const pageBooks = books.slice(start, start + state.bookshelfPerPage);
            const grid = $('bookshelfGrid');

            if (!pageBooks.length) {
                grid.innerHTML = '<p class="empty-state">没有找到书籍。</p>';
            } else {
                grid.innerHTML = pageBooks.map(book => `
                    <article class="book-card" data-book-id="${escapeHtml(book.book_id)}">
                        ${coverHtml(book, 'book-card-cover')}
                        <div class="book-card-info">
                            <h3 class="book-card-title">${escapeHtml(book.title || '未知书名')}</h3>
                            <p class="book-card-author">${escapeHtml(book.author || '未知作者')}</p>
                            <span class="book-card-count">${book.note_count || 0} 条笔记</span>
                        </div>
                    </article>
                `).join('');
            }

            grid.querySelectorAll('.book-card').forEach(card => {
                card.addEventListener('click', () => switchView('detail', card.getAttribute('data-book-id')));
            });

            renderPagination(total, state.bookshelfPerPage, state.bookshelfPage, 'bookshelfPagination', (page) => {
                state.bookshelfPage = page;
                renderBookshelf();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function getChapters(book) {
            
            
            const orderMap = new Map();
            (book.chapters || []).forEach((c, idx) => {
                if (c && c.uid !== undefined && c.uid !== null) orderMap.set(c.uid, idx);
            });
            const order = new Map();
            (book.notes || []).forEach(n => {
                const label = formatChapter(n.chapter);
                if (!label || order.has(label)) return;
                const pos = orderMap.has(n.chapter_uid) ? orderMap.get(n.chapter_uid) : Number.MAX_SAFE_INTEGER;
                order.set(label, pos);
            });
            return Array.from(order.entries())
                .sort((a, b) => a[1] - b[1])
                .map(([label]) => label);
        }

        function filteredNotes(book) {
            let notes = (book.notes || []).slice().sort((a, b) => toTs(b.created_at) - toTs(a.created_at));
            if (state.activeChapter) {
                notes = notes.filter(n => formatChapter(n.chapter) === state.activeChapter);
            }
            if (state.searchTerm) {
                const term = state.searchTerm.toLowerCase();
                notes = notes.filter(n => {
                    const h = (n.highlight || '').toLowerCase();
                    const c = (n.comment || '').toLowerCase();
                    const ch = formatChapter(n.chapter).toLowerCase();
                    return h.includes(term) || c.includes(term) || ch.includes(term);
                });
            }
            return notes;
        }

        function renderChapterList(book) {
            const list = $('chapterList');
            const chapters = getChapters(book);
            if (!chapters.length) {
                list.innerHTML = '<li class="chapter-item empty">无章节</li>';
                return;
            }
            list.innerHTML = chapters.map(ch => {
                const active = ch === state.activeChapter ? 'active' : '';
                return `<li class="chapter-item"><button class="${active}" data-chapter="${escapeHtml(ch)}">${escapeHtml(ch)}</button></li>`;
            }).join('');
            list.querySelectorAll('button[data-chapter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const ch = btn.getAttribute('data-chapter');
                    state.activeChapter = state.activeChapter === ch ? null : ch;
                    state.detailPage = 1;
                    renderChapterList(book);
                    renderDetailNotes();
                });
            });
        }

        function renderBookSelect() {
            const select = $('bookSelect');
            select.innerHTML = '<option value="">切换书籍</option>' +
                state.books.map(b => `<option value="${escapeHtml(b.book_id)}">${escapeHtml(b.title)} (${b.note_count || 0})</option>`).join('');
            select.value = state.selectedBookId || '';
            select.onchange = (e) => {
                if (e.target.value) {
                    state.selectedBookId = e.target.value;
                    state.activeChapter = null;
                    state.detailPage = 1;
                    renderDetail();
                }
            };
        }

        function renderDetailNotes() {
            const book = state.books.find(b => String(b.book_id) === String(state.selectedBookId));
            const grid = $('notesGrid');
            if (!book) {
                grid.innerHTML = '<p class="empty-state">选择一本书查看笔记。</p>';
                $('detailPagination').innerHTML = '';
                return;
            }

            const notes = filteredNotes(book);
            const total = notes.length;
            const totalPages = Math.max(1, Math.ceil(total / state.detailPerPage));
            if (state.detailPage > totalPages) state.detailPage = totalPages || 1;
            const start = (state.detailPage - 1) * state.detailPerPage;
            const pageNotes = notes.slice(start, start + state.detailPerPage);

            if (!pageNotes.length) {
                grid.innerHTML = '<p class="empty-state">当前筛选条件下没有笔记。</p>';
            } else {
                grid.innerHTML = pageNotes.map(note => `
                    <article class="note-card color-${escapeHtml(note.color || 'default')}">
                        <div class="note-tags">
                            ${formatChapter(note.chapter) ? `<span class="tag tag-chapter">${escapeHtml(formatChapter(note.chapter))}</span>` : ''}
                            <span class="tag tag-color">${escapeHtml(note.color || 'default')}</span>
                        </div>
                        <blockquote class="note-highlight">
                            ${note.highlight ? escapeHtml(note.highlight) : '<em>无划线内容</em>'}
                        </blockquote>
                        ${note.comment ? `<div class="note-comment"><strong>批注：</strong>${escapeHtml(note.comment)}</div>` : ''}
                        ${note.created_at ? `<time class="note-time">${formatDate(note.created_at)}</time>` : ''}
                    </article>
                `).join('');
            }

            renderPagination(total, state.detailPerPage, state.detailPage, 'detailPagination', (page) => {
                state.detailPage = page;
                renderDetailNotes();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        function renderDetail() {
            const book = state.books.find(b => String(b.book_id) === String(state.selectedBookId));
            const titleEl = $('bookTitle');
            const subEl = $('bookSub');

            if (!book) {
                titleEl.textContent = '请选择一本书';
                subEl.textContent = '-';
                renderBookCover(null);
                $('chapterList').innerHTML = '<li class="chapter-item empty">无章节</li>';
                renderDetailNotes();
                return;
            }

            titleEl.textContent = book.title || '未知书名';
            subEl.textContent = `${book.author || '未知作者'} · 共 ${book.note_count || 0} 条笔记`;
            renderBookCover(book);
            renderBookSelect();
            renderChapterList(book);
            renderDetailNotes();
        }

        function bootstrap(data) {
            const meta = data.meta || {};
            state.books = (data.books || []).slice().sort((a, b) => (b.note_count || 0) - (a.note_count || 0));
            renderMeta(meta);
            updateSideStats();
            switchView('bookshelf');
        }

        function enableFileFallback(err) {
            const meta = $('wereadMeta');
            meta.textContent = '当前使用 file:// 打开，点击这里选择 JSON 文件加载笔记。';
            meta.style.cursor = 'pointer';
            const input = $('jsonFileInput');
            meta.onclick = () => input.click();
            input.onchange = async (event) => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                try {
                    const text = await file.text();
                    bootstrap(JSON.parse(text));
                } catch (parseErr) {
                    meta.textContent = '加载失败: ' + parseErr.message;
                }
            };
            console.warn('Auto fetch failed in file mode:', err);
        }

        async function main() {
            $('backToBookshelf').addEventListener('click', () => switchView('bookshelf'));
            $('globalSearch').addEventListener('input', (e) => {
                state.searchTerm = e.target.value.trim();
                if (state.view === 'bookshelf') {
                    state.bookshelfPage = 1;
                    renderBookshelf();
                } else {
                    state.detailPage = 1;
                    renderDetailNotes();
                }
            });

            try {
                const res = await fetch(dataUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                bootstrap(await res.json());
            } catch (err) {
                if (location.protocol === 'file:') {
                    enableFileFallback(err);
                    return;
                }
                $('wereadMeta').textContent = '加载失败: ' + err.message;
                $('bookshelfGrid').innerHTML = '<p class="empty-state">数据加载失败</p>';
            }
        }

        main();
    })();
    </script>
</body>
</html>
