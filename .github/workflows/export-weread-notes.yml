name: Export WeRead Notes and Deploy to GitHub Pages

on:
  # 每天晚上 12 点自动更新（北京时间 00:00 = UTC 16:00）
  schedule:
    - cron: '0 16 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时也构建部署（用于发布博客/相册等新内容）
  push:
    branches:
      - main

# contents: write          —— 允许机器人提交导出的数据文件
# pages/id-token: write    —— 允许部署到 GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests flomo

      # 从微信读书/Flomo 拉取最新数据（对应密钥未配置时，脚本会自动跳过并保留已有数据）
      - name: Export WeRead notes and Flomo memos
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          WEREAD_API_GATEWAY: ${{ vars.WEREAD_API_GATEWAY || 'https://i.weread.qq.com/api/agent/gateway' }}
          FLOMO_AUTHORIZATION: ${{ secrets.FLOMO_AUTHORIZATION }}
          FLOMO_TAG: ${{ vars.FLOMO_TAG || 'Archive/Blog' }}
        run: python weread_hugo_exporter.py

      # 固定与本地一致的 Hugo 版本，避免 latest 升级导致模板行为变化
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      # 自动启用 Pages（若仓库限制不允许，请到 Settings → Pages 手动把 Source 设为 GitHub Actions）
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      # baseURL 使用 hugo.yml 中配置的自定义域名 blog.zzek.cn
      - name: Build Hugo site
        run: hugo --gc --minify

      # 仅提交导出的数据与生成的内容文件；构建产物 public/ 不再入库，
      # 由下面的 upload/deploy 步骤直接发布到 GitHub Pages
      - name: Commit updated notes and content
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/weread_notes.json static/data/flomo_memos.json content/weread/ content/memos/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto update weread notes and flomo memos [skip ci]"
            # actions/checkout 默认是 detached HEAD，需显式指定分支才能 push 成功
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
