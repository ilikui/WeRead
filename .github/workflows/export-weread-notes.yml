name: Export WeRead Notes and Deploy Hugo Site

on:
  # 每天晚上 12 点自动更新（北京时间 00:00 = UTC 16:00）
  schedule:
    - cron: '0 16 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时也构建部署（用于发布博客/相册等新内容）
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests

      # 从微信读书拉取最新划线与批注（未配置 WEREAD_API_KEY 时跳过，使用已有数据）
      - name: Export WeRead notes
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          WEREAD_API_GATEWAY: ${{ vars.WEREAD_API_GATEWAY || 'https://i.weread.qq.com/api/agent/gateway' }}
        run: |
          if [ -z "$WEREAD_API_KEY" ]; then
            echo "::warning::未配置 WEREAD_API_KEY，跳过数据更新，使用仓库中已有的笔记数据。"
          else
            python weread_hugo_exporter.py
          fi

      - name: Commit updated notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/weread_notes.json content/weread/
          git diff --staged --quiet || git commit -m "chore: auto update weread notes [skip ci]"
          git push

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 自动计算 GitHub Pages 的 baseURL，支持「用户/组织站点」与「项目站点」两种子路径
      - name: Build Hugo site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$REPO" = "$OWNER.github.io" ]; then
            BASEURL="https://$OWNER.github.io/"
          else
            BASEURL="https://$OWNER.github.io/$REPO/"
          fi
          echo "Building with baseURL: $BASEURL"
          hugo --gc --minify --baseURL "$BASEURL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
