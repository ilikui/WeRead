name: Export WeRead Notes and Publish Data

on:
  # 微信读书全量更新每日执行；Flomo 另有独立的高频同步任务
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weread-content-sync
  cancel-in-progress: false

jobs:
  export-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests flomo

      - name: Export WeRead notes and Flomo memos
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          WEREAD_API_GATEWAY: ${{ vars.WEREAD_API_GATEWAY || 'https://i.weread.qq.com/api/agent/gateway' }}
          FLOMO_AUTHORIZATION: ${{ secrets.FLOMO_AUTHORIZATION }}
          FLOMO_TAG: 'Archive/Blog'
        run: python weread_hugo_exporter.py

      - name: Validate and freeze public Memos dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("static/data/flomo_memos.json")
          if not source.exists():
              raise SystemExit("Missing Flomo dataset; refusing to publish an empty Memos page")
          data = json.loads(source.read_text(encoding="utf-8"))
          memos = data.get("memos")
          meta = data.get("meta") or {}
          if not isinstance(memos, list) or not memos:
              raise SystemExit("Invalid Flomo dataset: memos must be a non-empty array")
          if meta.get("tag_filter") != "Archive/Blog":
              raise SystemExit(f"Unexpected public tag filter: {meta.get('tag_filter')!r}")
          if meta.get("total_memos") != len(memos):
              raise SystemExit(f"Count mismatch: meta={meta.get('total_memos')}, actual={len(memos)}")
          ids = [m.get("id") for m in memos]
          if any(not value for value in ids) or len(ids) != len(set(ids)):
              raise SystemExit("Flomo dataset contains missing or duplicate memo IDs")
          for memo in memos:
              tags = {str(tag).lstrip("#").strip().casefold() for tag in memo.get("tags", [])}
              if "archive/blog" not in tags:
                  raise SystemExit(f"Out-of-scope memo detected: {memo.get('id')}")
          latest = Path("static/data/flomo_memos_latest.json")
          latest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Validated and staged {len(memos)} #Archive/Blog memos")
          PY

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Build and verify static site
        run: |
          hugo --gc --minify
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("public/data/flomo_memos_latest.json").read_text(encoding="utf-8"))
          memos = data.get("memos", [])
          if not memos or data.get("meta", {}).get("total_memos") != len(memos):
              raise SystemExit("Built Memos JSON is empty or inconsistent")
          page = Path("public/memos/index.html").read_text(encoding="utf-8")
          if "flomo_memos_latest.json" not in page:
              raise SystemExit("Memos page does not reference the canonical latest dataset")
          print(f"Build verified: /memos/ + {len(memos)} memo records")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/weread_notes.json static/data/flomo_memos.json static/data/flomo_memos_latest.json content/weread/ content/memos/
          if git diff --staged --quiet; then
            echo "No content changes; the existing published dataset remains intact."
          else
            git commit -m "chore: refresh reading and memo data [skip ci]"
            git push origin HEAD:main
          fi
