name: Export WeRead Notes and Deploy to GitHub Pages

on:
  # 每天晚上 12 点自动更新（北京时间 00:00 = UTC 16:00）
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests flomo

      - name: Export WeRead notes and Flomo memos
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          WEREAD_API_GATEWAY: ${{ vars.WEREAD_API_GATEWAY || 'https://i.weread.qq.com/api/agent/gateway' }}
          FLOMO_AUTHORIZATION: ${{ secrets.FLOMO_AUTHORIZATION }}
          FLOMO_TAG: 'Archive/Blog'
        run: python weread_hugo_exporter.py

      # Keep the tag filter strict, but allow a valid export containing only one memo.
      # Still reject empty or internally inconsistent exports before publishing.
      - name: Validate and prepare Flomo data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("static/data/flomo_memos.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          memos = data.get("memos")
          if not isinstance(memos, list):
              raise SystemExit("Invalid Flomo export: 'memos' must be an array")
          total = data.get("meta", {}).get("total_memos")
          if len(memos) < 1:
              raise SystemExit("Refusing to deploy empty Flomo data: no Archive/Blog memos found")
          if total != len(memos):
              raise SystemExit(f"Flomo count mismatch: meta.total_memos={total}, actual={len(memos)}")
          target = Path("static/data/flomo_memos_latest.json")
          target.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Validated {len(memos)} Flomo memos; prepared {target}")
          PY

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Build Hugo site
        run: hugo --gc --minify

      - name: Verify deployed Flomo artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("public/data/flomo_memos_latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          count = len(data.get("memos", []))
          expected = data.get("meta", {}).get("total_memos")
          if count < 1 or count != expected:
              raise SystemExit(f"Built artifact contains invalid Flomo data: actual={count}, expected={expected}")
          print(f"Build artifact verified: {count} Flomo memos")
          PY

      - name: Commit updated notes and content
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/weread_notes.json static/data/flomo_memos.json content/weread/ content/memos/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto update weread notes and flomo memos [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
