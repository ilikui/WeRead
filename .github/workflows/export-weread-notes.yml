name: Export WeRead Notes and Deploy Hugo Site

on:
  # 每天晚上 12 点自动更新（北京时间 00:00 = UTC 16:00）
  schedule:
    - cron: '0 16 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时也构建部署（用于发布博客/相册等新内容）
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  export-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests flomo

      # 从微信读书/Flomo 拉取最新数据（对应密钥未配置时，脚本会自动跳过并保留已有数据）
      - name: Export WeRead notes and Flomo memos
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          WEREAD_API_GATEWAY: ${{ vars.WEREAD_API_GATEWAY || 'https://i.weread.qq.com/api/agent/gateway' }}
          FLOMO_AUTHORIZATION: ${{ secrets.FLOMO_AUTHORIZATION }}
          FLOMO_TAG: ${{ vars.FLOMO_TAG || 'Archive/Blog' }}
        run: python weread_hugo_exporter.py

      - name: Commit updated notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/weread_notes.json content/weread/ static/data/flomo_memos.json content/memos/
          git diff --staged --quiet || git commit -m "chore: auto update weread notes and flomo memos [skip ci]"
          git push

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # 自动计算 GitHub Pages 的 baseURL，支持「用户/组织站点」与「项目站点」两种子路径
      - name: Build Hugo site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ "$REPO" = "$OWNER.github.io" ]; then
            BASEURL="https://$OWNER.github.io/"
          else
            BASEURL="https://$OWNER.github.io/$REPO/"
          fi
          echo "Building with baseURL: $BASEURL"
          hugo --gc --minify --baseURL "$BASEURL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
