name: Export WeRead Notes and Build Hugo Site

on:
  # 每天晚上 12 点自动更新（北京时间 00:00 = UTC 16:00）
  schedule:
    - cron: '0 16 * * *'
  # 手动触发
  workflow_dispatch:
  # 推送到 main 分支时也构建部署（用于发布博客/相册等新内容）
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: "build-and-commit"
  cancel-in-progress: false

jobs:
  export-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests flomo

      # 从微信读书/Flomo 拉取最新数据（对应密钥未配置时，脚本会自动跳过并保留已有数据）
      - name: Export WeRead notes and Flomo memos
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          WEREAD_API_GATEWAY: ${{ vars.WEREAD_API_GATEWAY || 'https://i.weread.qq.com/api/agent/gateway' }}
          FLOMO_AUTHORIZATION: ${{ secrets.FLOMO_AUTHORIZATION }}
          FLOMO_TAG: ${{ vars.FLOMO_TAG || 'Archive/Blog' }}
        run: python weread_hugo_exporter.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      # baseURL 使用 hugo.yml 中配置的 Netlify 自定义域名（站点部署在根路径，无需子路径拼接）
      - name: Build Hugo site
        run: hugo --gc --minify

      # Netlify 的发布目录直接指向仓库里的 public/，构建产物与数据变更需一并提交推送触发部署
      - name: Commit updated notes and site
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/weread_notes.json content/weread/ static/data/flomo_memos.json content/memos/ public/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto update weread notes, flomo memos and built site [skip ci]"
            # actions/checkout 默认是 detached HEAD，需显式指定分支才能 push 成功
            git push origin HEAD:${{ github.ref_name }}
          fi

